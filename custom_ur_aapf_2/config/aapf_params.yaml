# Parameters for custom_ur_aapf_2::SupervisorNode (AAPF local avoidance v2).
# Top-level key must match the node name (aapf_supervisor).
#
# Distances are in metres, times in seconds, rates in Hz. "Index offset/count"
# parameters are counts of DENSE (subdivided) waypoints; physical distance ≈
# offset * subdivide_step_m  (e.g. offset 12 * 0.01 m = 0.12 m ahead).
aapf_supervisor:
  ros__parameters:

    # ======== Obstacle-distance bands (§12: obstacle distances) ========
    safe_distance:              0.15   # [m] waypoint/EE considered SAFE at/above this (P1, P2 must clear it)
    blocked_distance_threshold: 0.03   # [m] (A1) chỉ bật AAPF khi vật cản CHẶN sát quỹ đạo (was 0.12)
    emergency_distance:         0.05   # [m] EE nearer than this → immediate STOP (EE_TOO_CLOSE)
    return_clearance:           0.20   # [m] EE clearance required before leaving AAPF_AVOID
    # NOTE: influence_distance (start of repulsion) lives in the aapf: block below.

    # ======== Waypoint / lookahead (§12: waypoint/lookahead) ========
    lookahead_waypoint_count: 50       # DETECTION range: dense waypoints ahead to look for a block (≈50 cm)
    p1_search_horizon:        200      # P1 SEARCH range: how far ahead the safe exit (P1) may be found
                                       # (≈2 m). MUST be > lookahead — exit past an obstacle is farther.
    p1_index_offset:          8        # P1 margin placed PAST the blocked region (KEEP SMALL « horizon)
    p2_index_offset:          10       # P2 margin placed BEFORE the blocked region (near, safety)
    max_p1_p2_distance:       0.60     # [m] P1–P2 span above this → OBSTACLE_TOO_LARGE
    min_p1_p2_distance:       0.04     # [m] minimum P1–P2 separation to bother avoiding

    # ======== Return to trajectory (§12: rejoin) ========
    return_to_path_distance: 0.05      # [m] EE within this of the path → rejoin to FOLLOW
    rejoin_waypoint_offset:  20        # attractor waypoint offset while returning

    # ======== Always-on debug lookahead points (visualization only) ========
    # Two waypoints a fixed # of dense steps ahead of the EE, published on
    # ~/lookahead_markers EVERY tick (translucent spheres). They do NOT affect
    # avoidance — the real P1/P2 are still resolved around the obstacle region.
    vis_p2_offset: 10                  # near debug lookahead (≈10 cm at 1 cm/step)
    vis_p1_offset: 50                  # far  debug lookahead (≈25 cm at 1 cm/step)

    # ======== Cartesian subdivision + nearest search ========
    subdivide_step_m:     0.01         # [m] target dense segment length after subdivision
    search_window_steps:  40           # forward window for the incremental nearest search

    # ======== Timing (§12: time/frequency) ========
    obstacle_check_rate: 30.0          # [Hz] P1/P2 + obstacle check (slow decision tick)
    aapf_control_rate:   200.0         # [Hz] AAPF velocity compute + publish (fast tick)
    avoid_timeout:       12.0          # [s] max time in AAPF_AVOID before STOP (AAPF_TIMEOUT)
    rejoin_timeout:      8.0           # [s] max time in RETURN before STOP (REJOIN_FAILED)
    scene_stale_sec:     0.5           # [s] planning scene older than this → STOP (SCENE_STALE)

    # ======== Safety (§12: safety) ========
    max_path_deviation: 0.50           # [m] EE-to-path beyond this → STOP (P1_UNSTABLE_OR_INVALID)
    # joint_limit_margin / singularity_threshold / enable_whole_body_check from the
    # instruction are handled by MoveIt Servo (see custom_ur_servo/config/moveit_servo.yaml:
    # joint_limit_margin, lower/hard_stop_singularity_threshold, check_collisions). They are
    # NOT re-implemented here to avoid duplicating Servo's safety layer.

    # ======== EE / gripper ========
    gripper_z_offset: 0.163            # [m] tool0 → gripper tip along tool0 local Z

    # ======== Arm joints (order matters; matches MoveIt group) ========
    arm_joints:
      - "shoulder_pan_joint"
      - "shoulder_lift_joint"
      - "elbow_joint"
      - "wrist_1_joint"
      - "wrist_2_joint"
      - "wrist_3_joint"

    # ======== Topics ========
    trajectory_topic:  "/display_planned_path"          # global plan in (DisplayTrajectory)
    servo_twist_topic: "/delta_twist_cmds"   # Cartesian twist out → Servo
                                             # MUST match moveit_servo.yaml: cartesian_command_in_topic
                                             # (custom_moveit_servo subscribes to /delta_twist_cmds, NOT /servo_node/...)

    # ======== Trajectory controller handoff ========
    # On AAPF_AVOID the active goal on this action is cancelled so streamed Servo
    # commands take over the shared joint_trajectory_controller. On a successful
    # rejoin the remaining global path is re-sent (if resume flag is true).
    controller_follow_action:     "/joint_trajectory_controller/follow_joint_trajectory"
    resume_trajectory_on_rejoin:  true
    # Re-IK resume (Cách 3): re-solve the remaining path's IK seeded from the real
    # current joints (continuation IK) + TOTG re-time, instead of replaying the
    # original joint values. Fixes the wrist-flip state-tolerance abort on rejoin.
    # Requires kinematics.yaml loaded into this node (done in aapf_supervisor.launch.py).
    # false → legacy raw replay (rollback, no rebuild needed).
    reik_resume:  true
    # Re-IK re-times the rebuilt suffix with TOTG. TOTG defaults to 100% of joint
    # limits → the resumed segment runs ~10x faster than the original plan (planned
    # at 0.1). Scale TOTG to match the original speed. Raise toward 1.0 for faster
    # resume; only affects the re-IK path (raw replay keeps original timing).
    resume_velocity_scaling:     0.1
    resume_acceleration_scaling: 0.1
    # NOTE: enable_controller_switch left at its default (false) in sim — there is
    # ONE controller (joint_trajectory_controller). Do NOT load aapf_params_real.yaml
    # in sim: it sets enable_controller_switch:true + scaled_joint_trajectory_controller,
    # which do not exist here and abort with a STRICT controller-switch error.

    # ======== Singularity coast (trục 2) ========
    # Independent of controller switching. Near a singularity, switch the avoidance
    # command from Cartesian twist (Servo decelerates) to a held joint velocity on
    # servo_joint_topic → Servo joint path skips singularity scaling → coast through
    # at constant joint speed. Works in sim because Servo's joint output goes to the
    # same joint_trajectory_controller (no controller switch needed).
    servo_joint_topic: "/delta_joint_cmds"   # JointJog out → Servo joint path
    enable_singularity_coast: true
    singularity:
      kappa_enter: 20.0   # κ above this → JOINT_HOLD
      kappa_exit:  18.0   # κ below this → back to CARTESIAN_TWIST (gap = hysteresis band)

    # ======== MoveIt group / frames ========
    move_group_name: "ur3_manipulator"
    planning_frame:  "world"
    ee_link:         "tool0"

    # ======== AAPF velocity tuning (§12: AAPF velocity) ========
    # NOTE: command_frame must match the frame the FK above produces (planning_frame)
    # AND a frame MoveIt Servo accepts for delta_twist_cmds. For a UR mounted at the
    # world origin, "world" == "base_link"; change here if your mount differs.
    aapf:
      k_att:                1.5     # attractive gain (pull toward P1)
      k_rep:                0.05    # repulsive gain (push off obstacle surface)
      influence_distance:   0.07    # [m] ρ0 — repulsion influence radius (start of v_rep)
      v_max:                0.50    # [m/s] output linear-velocity cap
      v_min:                0.02    # [m/s] floor on non-zero commands
      repulsive_saturation: 0.20    # [m/s] (B1) cap MỖI số hạng đẩy, mềm hơn (was 0.50)
      v_rep_max:            0.25    # [m/s] (B2) cap TỔNG repulsion trước khi cộng attraction (<v_max)
      command_frame:        "world"

# ----------------------------------------------------------------------------
# ObstacleManager — dev helper to spawn a single sphere into the planning scene.
# ----------------------------------------------------------------------------
obstacle_manager:
  ros__parameters:
    obstacle:
      id:        "test_sphere"
      frame_id:  "world"
      x:         0.5
      y:         0.0
      z:         0.6
      radius:    0.1

# ----------------------------------------------------------------------------
# InteractiveObstacle — peer obstacle source you drag in RViz. Distinct id so it
# coexists with test_sphere. Drag the marker (topic /interactive_obstacle/update)
# and the supervisor sees it move live. Future camera sources slot in the same
# way: a new node publishing CollisionObjects to /planning_scene with its own id.
# ----------------------------------------------------------------------------
interactive_obstacle:
  ros__parameters:
    obstacle:
      id:        "interactive_obstacle"
      frame_id:  "world"
      x:         0.5
      y:         0.3
      z:         0.6
      radius:    0.1
