# Biến thể REAL của moveit_controllers.yaml.
# Khác bản sim DUY NHẤT ở tên motion controller:
#   sim  -> joint_trajectory_controller
#   real -> scaled_joint_trajectory_controller (ur_controllers, tôn trọng speed slider)
# (CHECKLIST #2 — dây "move_group thực thi" trong chế độ FOLLOW_TRAJECTORY)

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - gripper_position_controller

  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true

  gripper_position_controller:
    type: GripperCommand
    joints:
      - robotiq_85_left_knuckle_joint
    action_ns: gripper_cmd
    default: true
